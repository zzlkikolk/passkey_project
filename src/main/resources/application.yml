server:
  port: 8080
spring:
  application:
    name: passkey-demo
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/passkey_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    timeout: 2s
passkey:
  rp-id: ${PASSKEY_RP_ID:localhost}
  rp-name: ${PASSKEY_RP_NAME:Passkey Demo}
  origin: ${PASSKEY_ORIGIN:http://localhost:8080}
  challenge-ttl-seconds: 300
logging:
  level:
    com.example.passkey: INFO
